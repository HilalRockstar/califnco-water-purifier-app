<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1976d2" />
      <stop offset="100%" stop-color="#0d47a1" />
    </linearGradient>
    <linearGradient id="dropGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="80%" stop-color="#e0f2fe" />
      <stop offset="100%" stop-color="#bae6fd" />
    </linearGradient>
    <linearGradient id="innerDrop" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)" />
  <!-- Water Droplet Silhouette -->
  <path d="M 256,70 C 256,70 130,225 130,325 C 130,395 186,450 256,450 C 326,450 382,395 382,325 C 382,225 256,70 256,70 Z" fill="url(#dropGrad)" />
  <!-- Inner Drop Accent -->
  <path d="M 256,220 C 256,220 200,295 200,345 C 200,378 225,405 256,405 C 287,405 312,378 312,345 C 312,295 256,220 256,220 Z" fill="url(#innerDrop)" />
  <!-- Highlight reflection -->
  <ellipse cx="225" cy="290" rx="18" ry="32" transform="rotate(-25 225 290)" fill="#ffffff" opacity="0.85" />
</svg>
